<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceForge | Secure Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">TF</div>
    <p class="eyebrow">SECURITY OPERATIONS</p>
    <h1>TraceForge</h1>
    <p class="muted">Sign in to your investigation workspace.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" required maxlength="1024"
             autocomplete="current-password" autofocus>
      <button type="submit">Authenticate <span aria-hidden="true">→</span></button>
    </form>
    <p class="footnote">Private workspace · Authorized access only</p>
  </main>
</body>
</html>
